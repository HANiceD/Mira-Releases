name: Publish release notices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - notices/**
      - scripts/build-notice-bundle.mjs
      - .github/workflows/publish-notices.yml

permissions:
  contents: read

concurrency:
  group: publish-release-notices
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build validated notice bundle
        run: node scripts/build-notice-bundle.mjs --out /tmp/mira-notices
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.49
      - name: Prepare notice directories
        run: >-
          flyctl ssh console
          --app "$FLY_APP"
          --command "mkdir -p /app/data/cdn/notice/assets /app/data/cdn/notice/darwin-arm64 /app/data/cdn/notice/darwin-x64 /app/data/cdn/notice/win32-x64"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
      - name: Upload immutable notices and per-version banners
        run: |
          find /tmp/mira-notices -type f ! -name index.json -print0 | while IFS= read -r -d '' file; do
            relative="${file#/tmp/mira-notices/}"
            [[ "$relative" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
            remote="/app/data/cdn/notice/$relative"
            staged="$remote.next-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            flyctl ssh sftp put "$file" "$staged" --app "$FLY_APP"
            flyctl ssh console --app "$FLY_APP" --command \
              "sh -lc \"if [ -e '$remote' ]; then cmp -s '$staged' '$remote' || exit 1; rm '$staged'; else mv '$staged' '$remote'; fi\""
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
      - name: Replace version indexes after all notices are ready
        run: |
          find /tmp/mira-notices -type f -name index.json -print0 | while IFS= read -r -d '' file; do
            relative="${file#/tmp/mira-notices/}"
            [[ "$relative" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
            remote="/app/data/cdn/notice/$relative"
            staged="$remote.next-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            flyctl ssh sftp put "$file" "$staged" --app "$FLY_APP"
            flyctl ssh console --app "$FLY_APP" --command "sh -lc \"mv '$staged' '$remote'\""
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
      - name: Verify the public notice contract
        run: |
          find /tmp/mira-notices -type f -print0 | while IFS= read -r -d '' file; do
            relative="${file#/tmp/mira-notices/}"
            curl --fail --silent --show-error "https://api.heymira.online/notice/$relative" \
              | cmp - "$file"
          done
